  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

     <div style=\"font-weight:800;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(241,250,238,.55)\">Posesión en<\u002Fdiv>\n          <div style=\"font-weight:800;font-size:36px;line-height:1;margin-top:4px;color:{{ timerColor }};font-variant-numeric:tabular-nums\">{{ timeText }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(29,53,87,.62);border:2px solid rgba(241,250,238,.12);border-radius:999px;padding:10px 22px;font-weight:800;font-size:13px;letter-spacing:.5px;max-width:44vw;display:flex;align-items:center;gap:10px\"><span style=\"display:inline-block;transform:rotate({{ compassRot }});color:#E63946;font-size:14px;line-height:1\">▲<\u002Fspan><span>{{ objective }}<\u002Fspan><\u002Fdiv>\n\n      <div style=\"position:absolute;left:26px;bottom:24px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;width:200px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <div style=\"width:78px;font-weight:800;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(241,250,238,.55)\">Linterna F<\u002Fdiv>\n            <div style=\"flex:1;height:6px;border-radius:999px;background:rgba(241,250,238,.12);overflow:hidden\"><div style=\"height:100%;width:{{ battWidth }};background:{{ battColor }};border-radius:999px\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <div style=\"width:78px;font-weight:800;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(241,250,238,.55)\">Aliento<\u002Fdiv>\n            <div style=\"flex:1;height:6px;border-radius:999px;background:rgba(241,250,238,.12);overflow:hidden\"><div style=\"height:100%;width:{{ stamWidth }};background:#A8DADC;border-radius:999px\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <div style=\"width:78px;font-weight:800;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(241,250,238,.55)\">Agua bendita<\u002Fdiv>\n            <div style=\"font-weight:800;font-size:13px;color:#A8DADC;font-variant-numeric:tabular-nums\">✕ {{ ammo }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute;right:26px;bottom:24px;max-width:300px;text-align:right;font-weight:600;font-size:11px;letter-spacing:.4px;color:rgba(241,250,238,.5);line-height:1.7\">WASD moverse · SHIFT correr · F linterna · CLIC agua bendita · E esconderte<br>Si te atrapan subes un piso · el rescate solo llega a la azotea · si te ven entrar al armario, te sacarán<\u002Fdiv>\n\n      <sc-if value=\"{{ hiddenView }}\">\n        <div style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#020304 0%,#020304 30%,rgba(2,3,4,.92) 33%,rgba(2,3,4,.08) 36%,rgba(2,3,4,.08) 42%,rgba(2,3,4,.92) 45%,#020304 50%,rgba(2,3,4,.92) 55%,rgba(2,3,4,.08) 58%,rgba(2,3,4,.08) 64%,rgba(2,3,4,.92) 67%,#020304 70%,#020304 100%)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font-weight:800;font-size:12px;letter-spacing:2.5px;color:rgba(241,250,238,.65);text-transform:uppercase\">Escondido · pulsa E para salir<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showBanner }}\">\n        <div style=\"position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:800;font-size:40px;letter-spacing:3px;text-transform:uppercase;color:#E63946;text-shadow:0 2px 30px rgba(0,0,0,.8);animation:bannerIn 2.4s ease forwards;white-space:nowrap\">{{ banner }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ paused }}\">\n        <div onclick=\"{{ onResume }}\" style=\"position:absolute;inset:0;background:rgba(5,7,10,.78);display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer\">\n          <div style=\"text-align:center\">\n            <div style=\"font-weight:800;font-size:30px;letter-spacing:2px\">PAUSA<\u002Fdiv>\n            <div style=\"margin-top:10px;font-weight:600;font-size:14px;color:rgba(241,250,238,.6)\">Haz clic para continuar · Click to resume<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:auto;background:linear-gradient(rgba(5,7,10,.7),rgba(5,7,10,.88))\">\n      <div style=\"max-width:560px;width:100%;text-align:center;animation:creep .6s ease both\">\n        <div style=\"display:inline-flex;align-items:center;gap:8px;background:#E63946;color:#F1FAEE;border-radius:999px;padding:6px 14px;font-weight:800;font-size:11px;letter-spacing:2px\">MALDITAS · CURSED<\u002Fdiv>\n        <h1 style=\"margin-top:20px;font-weight:800;font-size:52px;line-height:.98;letter-spacing:-1px\">TORRES<br>DEL SISAL<\u002Fh1>\n        <div style=\"margin-top:10px;font-weight:800;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#E63946\">El trampolín de la muerte<\u002Fdiv>\n        <p style=\"margin-top:22px;font-weight:400;font-size:15px;line-height:1.7;color:rgba(241,250,238,.82)\">La ley de las torres es una sola: <strong style=\"color:#F1FAEE\">siempre hacia arriba<\u002Fstrong>. Cada vez que un fantasma te atrapa — o la posesión se completa — despiertas un piso más alto. Subir es inevitable: al final te espera la azotea, el trampolín de la muerte. Tu única esperanza es el <strong style=\"color:#F1FAEE\">teléfono<\u002Fstrong> escondido en los pisos: haz la llamada, y el rescate te estará esperando arriba — sobrevive en la azotea hasta que lleguen. La <strong style=\"color:#F1FAEE\">pistola de agua bendita<\u002Fstrong> disuelve fantasmas (clic), el amuleto purga la posesión, y tu linterna <strong style=\"color:#F1FAEE\">(F)<\u002Fstrong> congela a las sombras. Adentro esperan los espantos del llano: La Sayona, La Llorona, El Silbón — si su silbido suena lejos, ya lo tienes encima — los duendes, y la Bola de Fuego. Si oyes un carretón en la calle, alguien está por morir.<\u002Fp>\n        <p style=\"margin-top:12px;font-weight:600;font-size:12px;line-height:1.6;color:rgba(241,250,238,.5)\">The climb is inevitable — every catch drags you up. Make the call before you reach the rooftop, then survive there until rescue arrives.<\u002Fp>\n        <button onclick=\"{{ onEnter }}\" style=\"margin-top:26px;background:#E63946;color:#F1FAEE;border:none;border-radius:999px;padding:16px 40px;font-family:inherit;font-weight:800;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background .15s ease\" style-hover=\"background:#c92f3c\">Entrar ▸<\u002Fbutton>\n        <div style=\"margin-top:20px;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:rgba(241,250,238,.4)\">Contenido de terror · Usa audífonos · Requiere teclado + ratón<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isEnd }}\">\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:auto;background:linear-gradient(rgba(5,7,10,.78),rgba(5,7,10,.94))\">\n      <div style=\"max-width:520px;width:100%;text-align:center;animation:creep .6s ease both\">\n        <h1 style=\"font-weight:800;font-size:42px;line-height:1.02;letter-spacing:-.5px;color:{{ endColor }}\">{{ endTitle }}<\u002Fh1>\n        <p style=\"margin-top:18px;font-weight:400;font-size:16px;line-height:1.7;color:rgba(241,250,238,.82)\">{{ endSub }}<\u002Fp>\n        <button onclick=\"{{ onRestart }}\" style=\"margin-top:28px;background:#E63946;color:#F1FAEE;border:none;border-radius:999px;padding:15px 38px;font-family:inherit;font-weight:800;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background .15s ease\" style-hover=\"background:#c92f3c\">Volver a entrar ▸<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;difficulty&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Piadoso&quot;,&quot;options&quot;:[&quot;Piadoso&quot;,&quot;Normal&quot;,&quot;Pesadilla&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Juego&quot;},&quot;mouseSensitivity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.4,&quot;min&quot;:0.4,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Controles&quot;},&quot;flashlight&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ambiente&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.mountRef = React.createRef();\n    this.keys = {}; this.yaw = 0; this.pitch = 0;\n    this._intervals = []; this._raf = null; this._dread = 0; this._hudAcc = 0;\n    this.torchOn = true; this.torchBattery = 100; this._stam = 100; this._nearest = 1e9;\n    this._fallbackLook = false; this._hadLock = false;\n    this.ammo = 0; this.rescueT = -1; this.phoneUsed = false; this.pistolTaken = false; this.callMade = false;\n    this.hidden = null;\n  }\n  state = { phase:'intro', floor:1, timeText:'05:00', timerColor:'#F1FAEE', dread:0, objective:'', banner:'', paused:false, ending:null, batt:100, stam:100, compassRot:'0deg', ammo:0, hiddenView:false };\n\n  renderVals(){\n    const s = this.state, end = s.ending;\n    return {\n      mountRef: this.mountRef,\n      isIntro: s.phase==='intro', isPlaying: s.phase==='playing', isEnd: s.phase==='end',\n      paused: s.paused,\n      floorText: String(s.floor).padStart(2,'0'),\n      objective: s.objective, timeText: s.timeText, timerColor: s.timerColor,\n      dreadPct: Math.round(s.dread), dreadWidth: Math.round(s.dread)+'%',\n      redOpacity: Math.min(.62, s.dread/100*.68),\n      battWidth: Math.round(s.batt)+'%', battColor: s.batt<25?'#E63946':'#A8DADC',\n      stamWidth: Math.round(s.stam)+'%', compassRot: s.compassRot, ammo: s.ammo, hiddenView: s.hiddenView,\n      showBanner: !!s.banner, banner: s.banner,\n      endTitle: end?end.title:'', endSub: end?end.sub:'', endColor: end?(end.bad?'#E63946':'#A8DADC'):'#F1FAEE',\n      onEnter: ()=>this.start(), onRestart: ()=>this.start(), onResume: ()=>this._lock(),\n    };\n  }\n\n  diff(){\n    const d=(this.props&&this.props.difficulty)||'Normal';\n    const m={ 'Piadoso':{time:300,pull:.75,near:5.5,spike:20,rescue:40,creep:.32}, 'Normal':{time:180,pull:1,near:8,spike:30,rescue:50,creep:.5}, 'Pesadilla':{time:150,pull:1.5,near:11,spike:42,rescue:65,creep:.7} };\n    return m[d]||m['Normal'];\n  }\n\n  componentDidMount(){\n    this._waitThree(0);\n    this._kd=(e)=>{ this.keys[e.code]=true; if(['KeyW','KeyS','KeyA','KeyD','Space'].includes(e.code)) e.preventDefault(); if(e.code==='KeyF'&&this.state.phase==='playing'&&!this.state.paused){ this.torchOn=!this.torchOn; if(this.torchOn&&this.torchBattery<=0) this.torchOn=false; } if(e.code==='KeyE') this._toggleHide(); if(e.code==='Escape'&&this._fallbackLook&&this.state.phase==='playing') this.setState({paused:true}); };\n    this._ku=(e)=>{ this.keys[e.code]=false; };\n    window.addEventListener('keydown',this._kd); window.addEventListener('keyup',this._ku);\n    this._mm=(e)=>{ this._cursor={x:e.clientX,y:e.clientY}; if((document.pointerLockElement||this._fallbackLook)&&this.state.phase==='playing'&&!this.state.paused){ const s=((this.props&&this.props.mouseSensitivity)||1)*.0022; this.yaw-=e.movementX*s; this.pitch-=e.
