name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stamp build version (commit SHA + date)
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          sed -i "s/window.TDS_BUILD = '[^']*'/window.TDS_BUILD = '${SHA} · ${DATE}'/" public/index.html
          sed -i "s/build v4/build ${SHA}/" public/index.html
          echo "Stamped build ${SHA} (${DATE})"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=torres-del-sisal --branch=main --commit-hash=${{ github.sha }}
