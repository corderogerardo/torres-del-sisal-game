name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Without the Cloudflare token this can't deploy. Skip cleanly (green run,
      # no failure email) instead of erroring. Deploy manually with ./deploy.sh,
      # or add the CLOUDFLARE_API_TOKEN secret to enable auto-deploy.
      - name: No Cloudflare token — skipping auto-deploy
        if: ${{ env.CF_API_TOKEN == '' }}
        run: |
          echo "::notice title=Auto-deploy skipped::CLOUDFLARE_API_TOKEN secret is not set. The site was NOT deployed by this run. Add the secret to enable auto-deploy, or run ./deploy.sh locally."

      - name: Stamp build version (commit SHA + date)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          sed -i "s/window.TDS_BUILD = '[^']*'/window.TDS_BUILD = '${SHA} · ${DATE}'/" public/index.html
          sed -i "s/build v4/build ${SHA}/" public/index.html
          echo "Stamped build ${SHA} (${DATE})"

      # public/supabase-config.js is gitignored, so a fresh checkout never has it
      # and the run-record integration would ship permanently disabled. The
      # publishable key is public by design, so it belongs in repository
      # variables rather than secrets.
      - name: Materialize Supabase publishable config
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning title=Run records disabled::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY repository variables are not set. The leaderboard will ship disabled."
            exit 0
          fi
          cat > public/supabase-config.js <<EOF
          export default Object.freeze({
            url: '$SUPABASE_URL',
            publishableKey: '$SUPABASE_PUBLISHABLE_KEY',
          });
          EOF
          echo "Wrote public/supabase-config.js for $SUPABASE_URL"

      # The client's own key check runs in the browser, long after the bytes are
      # on the wire. This gate fails the build before a secret can be published.
      - name: Abort if a Supabase secret key reached the build
        if: ${{ env.CF_API_TOKEN != '' }}
        run: |
          if grep -rE 'sb_secret_|"role"[[:space:]]*:[[:space:]]*"service_role"|SUPABASE_SERVICE_ROLE|SUPABASE_DB_PASSWORD|postgres(ql)?://' public/; then
            echo "::error::A Supabase secret or database credential is staged for deploy. Aborting without publishing."
            exit 1
          fi
          echo "No Supabase secrets in the build output"

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=torres-del-sisal --branch=main --commit-hash=${{ github.sha }}
